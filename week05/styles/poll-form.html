<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Form</title>
</head>
<body>
    <header>
            
    </header>
    <main>
        <form action="">
            <label for="full name">Full Name</label>
            <input type="text" id="full name" name="full name" required>

            <label for="user email"> Email</label>
            <input type="email" id="user email" name="user email" required>

            <label for="browser">what is your favorite browser?</label>
            <select name="browser" id="browser">
                <option value="chrome">Chrome</option>
                <option value="firefox">Firefox</option>
                <option value="safari">Safari</option>
                <option value="edge">Edge</option>
            </select>

            <label for="pet">do you have a household pet?</label>
            <input type="checkbox" name="pet" id="pet">

            <label for="feedback">list the places you have lived:</label>
            <textarea name="feedback" id="feedback" rows="4" placeholder="Accra Ghana Togo Lome Nigeria Abuja France Paris England London"></textarea>               
           
            <button type="submit">Submit Poll</button>  
        
        </form>

    </main>
    <footer>

    </footer>
</body>
</html>
