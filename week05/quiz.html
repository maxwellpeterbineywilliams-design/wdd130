<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Quiz Form</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>
    <header>
        <h1>✅Basic HTML and CSS Quiz</h1>
    </header>
    <main class="box">
        <form class="box">
            <div class="quiz-item box">
                <label for="q1">1. What does the Acronym CSS stand for?</label>
                <input type="text" id="q1" name="q1">
            </div>
            <div class="quiz-item box">
                <label for="q2">2. How are the id and class attributes selected in CSS?</label>
                <textarea type="text" id="q2" name="q2"></textarea>
            </div>
            <div class="quiz-item box">
                <label for="q3">3. Which of the following is a valid CSS comment?</label>
                <select type="text" id="q3" name="q3">
                    <option value="" selected disabled>choose one</option>
                    <option value="a"> ---comment</option>
                    <option value="b">// comment</option>
                    <option value="c">/* comment */</option>
                </select>
            </div>
            <div class="quiz-item box">
                <label for="q4">4. What is the button margin given this declaration:  </label>
                    <code class="box">margin: 10px 5px 15px;</code>
              
                <input type="text" id="q4" name="q4">
            </div>
            <button type="submit">Submit Quiz</button>
 
 
 
 
                
        </form>

    </main>
                
    
</body>
</html>
